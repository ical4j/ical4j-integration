[versions]
ical4j = "4.2.2"
ical4j-vcard = "2.1.0"
groovy = "3.0.22"
log4j = "2.23.1"
spock = "2.4-M4-groovy-3.0"
greenmail = "2.0.1"


[libraries]
ical4j = { module = "org.mnode.ical4j:ical4j", version.ref = "ical4j" }
ical4j-vcard = { module = "org.mnode.ical4j:ical4j-vcard", version.ref = "ical4j-vcard" }

groovy = { module = "org.codehaus.groovy:groovy", version.ref = "groovy"}

log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j"}
log4j-slf4j2 = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j"}

spock-bom = { module = "org.spockframework:spock-bom", version.ref = "spock"}
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock"}

greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail"}
